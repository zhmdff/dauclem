[package]
name = "dauclem"
version = "1.0.0"
description = "Fast local viewer + search for Claude Code chat history"
authors = ["zhmdff <zhmdff@gmail.com>"]
edition = "2021"

[lib]
name = "dauclem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-full"] }
dirs = "6"
once_cell = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

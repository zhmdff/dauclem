name: Release

on:
  push:
    branches: [main]

# Serialize so two quick pushes don't race on the version bump.
concurrency: release

permissions:
  contents: write

jobs:
  release:
    # Bump commit is pushed with GITHUB_TOKEN (doesn't retrigger); this is a belt-and-braces guard.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: bump
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = [version]$conf.version
          $new = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          function Set-Ver($path, $pattern, $repl) {
            $t = [System.IO.File]::ReadAllText("$PWD/$path")
            $t = [regex]::Replace($t, $pattern, $repl, 1)
            [System.IO.File]::WriteAllText("$PWD/$path", $t, (New-Object System.Text.UTF8Encoding $false))
          }
          Set-Ver 'src-tauri/tauri.conf.json' '"version":\s*"[^"]*"' "`"version`": `"$new`""
          Set-Ver 'package.json' '"version":\s*"[^"]*"' "`"version`": `"$new`""
          Set-Ver 'src-tauri/Cargo.toml' '(?m)^version\s*=\s*"[^"]*"' "version = `"$new`""
          Set-Ver 'src-tauri/Cargo.lock' '(?m)(name = "dauclem"\r?\nversion = )"[^"]*"' "`$1`"$new`""
          "version=$new" >> $env:GITHUB_OUTPUT

      - name: Commit bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.bump.outputs.version }}
          releaseName: dauclem v${{ steps.bump.outputs.version }}
          releaseBody: See assets below to download and install.
          releaseDraft: false
          prerelease: false
